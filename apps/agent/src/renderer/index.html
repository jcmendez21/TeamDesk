<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TeamDesk Agent</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #07090d; color: #f2f4f8;
        user-select: none;
      }
      h1 {
        font-size: 11px; margin: 0 0 14px; letter-spacing: 0.10em;
        color: #5a5f6a; font-weight: 600;
      }
      .id-card {
        background: linear-gradient(180deg, #12161f, #0e121a);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        text-align: center;
      }
      .id-label { font-size: 10px; color: #5a5f6a; letter-spacing: 0.10em; margin-bottom: 8px; }
      .id-value {
        font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
        font-size: 30px; font-weight: 600; color: #00e5ff;
        letter-spacing: 0.10em;
        text-shadow: 0 0 12px rgba(0,229,255,0.35);
        user-select: text; cursor: copy;
      }
      .row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; padding: 8px 14px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 6px; margin-bottom: 6px;
      }
      .label { color: #8a8f9b; font-size: 11px; }
      .value { color: #f2f4f8; font-family: ui-monospace, monospace; font-size: 11px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .dot.green { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.6); }
      .dot.amber { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.6); animation: pulse 1.5s infinite; }
      .dot.red   { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.6); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      button {
        width: 100%; margin-top: 8px;
        background: rgba(239,68,68,0.10);
        color: #ef4444;
        border: 1px solid rgba(239,68,68,0.40);
        padding: 10px; border-radius: 6px; font-size: 12px;
        cursor: pointer; letter-spacing: 0.06em;
        text-transform: uppercase; font-weight: 600;
      }
      button:hover { background: #ef4444; color: #fff; }
      video { display: none; }
    </style>
  </head>
  <body>
    <h1>TEAMDESK · AGENT</h1>

    <div class="id-card">
      <div class="id-label">CONNECTION ID</div>
      <div class="id-value" id="connId" title="Click to copy">—</div>
      <div class="id-label" style="margin-top: 14px;">PASSWORD</div>
      <div class="id-value" id="connPwd" title="Click to copy" style="font-size: 22px; color: #f59e0b; text-shadow: 0 0 12px rgba(245,158,11,0.35);">—</div>
    </div>

    <div class="row">
      <span class="label">Status</span>
      <span class="value"><span class="dot amber" id="statusDot"></span><span id="status">starting…</span></span>
    </div>
    <div class="row">
      <span class="label">Scope</span>
      <span class="value" id="scope">—</span>
    </div>
    <div class="row">
      <span class="label">Signaling</span>
      <span class="value" id="signalingUrl">—</span>
    </div>
    <div class="row">
      <span class="label">Platform</span>
      <span class="value" id="platform">—</span>
    </div>

    <button id="stop">Stop sharing</button>

    <!-- Off-screen video element so the captured stream stays alive across renders. -->
    <video id="captureVideo" autoplay muted></video>

    <script src="./host.js"></script>
  </body>
</html>
